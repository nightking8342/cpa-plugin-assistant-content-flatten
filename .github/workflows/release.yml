# Build plugin binaries for every platform CPA runs on, on tag push.
#
# -buildmode=c-shared needs a C compiler **for the target platform**, and Go
# cannot cross-compile cgo without a matching cross toolchain. So each target is
# built on a native runner; do not collapse this matrix onto ubuntu.
#
# Artifacts: <id>_<version>_<goos>_<goarch>.zip containing <id>.<ext> at the zip
# root, plus checksums.txt.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into artifact names (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

env:
  PLUGIN_ID: assistant-content-flatten

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: .so
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            ext: .so
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            ext: .dylib
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            ext: .dylib
            runner: macos-15
          - goos: windows
            goarch: amd64
            ext: .dll
            runner: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: CGO_ENABLED=0 go test ./...
        shell: bash

      # Native build: GOOS/GOARCH match the runner, so the host C compiler is the
      # right one. Linux targets are built against glibc, which is what CPA's
      # Debian-based runtime image needs (a musl build fails to dlopen there).
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          go build -trimpath -buildmode=c-shared -ldflags "-s -w" \
            -o "${{ env.PLUGIN_ID }}${{ matrix.ext }}" .
        shell: bash

      # pwsh is preinstalled on every GitHub runner and Compress-Archive is
      # portable; the Windows runner has neither `zip` nor a POSIX shell.
      - name: Package
        id: package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -like 'v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = '${{ github.event.inputs.version }}'
          }
          if (-not $version) { throw 'no version: push a v* tag or set the workflow_dispatch input' }

          $id  = '${{ env.PLUGIN_ID }}'
          $zip = "${id}_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"

          Remove-Item -Force -ErrorAction SilentlyContinue *.h
          Compress-Archive -Path "$id${{ matrix.ext }}" -DestinationPath $zip -Force

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip=$zip"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.zip > checksums.txt

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/checksums.txt
